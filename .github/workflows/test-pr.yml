name: Test PR

on:
  # Every PR, whatever its base: stacked PRs (a branch opened against another
  # feature branch) get checks too, so a reviewer can read CI results instead
  # of tracing tests by hand.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Allow commenting on PRs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for semantic-release

      # Which idtap-contract ref to test against. Defaults to main; a client PR
      # that ports a contract change still under review sets the file to that
      # contract branch and resets it to main once both land.
      - name: Resolve idtap-contract ref
        id: contract-ref
        run: echo "ref=$(tr -d '[:space:]' < .idtap-contract-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout idtap-contract (golden fixtures)
        uses: actions/checkout@v4
        with:
          repository: HAI-Res/idtap-contract
          ref: ${{ steps.contract-ref.outputs.ref }}
          path: idtap-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      # Deliberately resolves from pyproject.toml, NOT uv.lock: this is a published
      # library, so CI must test the same resolution PyPI users get.
      - name: Install dependencies
        run: |
          uv pip install --system -e .[dev]
          uv pip install --system build twine toml
          
      - name: Run tests
        # REQUIRE_CONTRACT=1 makes the contract-conformance suite hard-fail if the
        # fixtures checkout above is missing (instead of silently skipping).
        env:
          IDTAP_CONTRACT_DIR: ${{ github.workspace }}/idtap-contract
          REQUIRE_CONTRACT: '1'
        run: pytest idtap/tests/ -m "not integration"
        
      - name: Validate version consistency
        run: |
          echo "Checking version consistency across files..."
          INIT_VERSION=$(python -c "import idtap; print(idtap.__version__)")
          TOML_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          
          echo "__init__.py version: $INIT_VERSION"
          echo "pyproject.toml version: $TOML_VERSION"
          
          if [ "$INIT_VERSION" != "$TOML_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            echo "__init__.py: $INIT_VERSION"
            echo "pyproject.toml: $TOML_VERSION"
            exit 1
          fi
          echo "✅ Versions are consistent"
        
      - name: Build package
        run: python -m build
        
      - name: Test version bump script
        run: |
          echo "Testing version bump script..."
          python scripts/bump_version.py --help 2>/dev/null || echo "Version script ready"
          
      # FROZEN during the MIT-infra migration: TestPyPI upload is gated OFF (it still
      # publishes to a PyPI index). Re-enable at cutover by setting the repository variable
      # ENABLE_TESTPYPI_PUBLISH = 'true'. Tests + build above still run on every PR.
      - name: Test upload to TestPyPI
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_TESTPYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TESTPYPI_API_TOKEN }}

      - name: Comment PR with TestPyPI link
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_TESTPYPI_PUBLISH == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const testPypiUrl = `https://test.pypi.org/project/idtap/`;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 **Test Package Built Successfully!**
              
              This PR has been automatically built and uploaded to TestPyPI for testing.
              
              🔗 **TestPyPI Link**: ${testPypiUrl}
              
              To test this version:
              \`\`\`bash
              pip install --index-url https://test.pypi.org/simple/ idtap
              \`\`\`
              
              ✅ All tests passed and package builds successfully.`
            });