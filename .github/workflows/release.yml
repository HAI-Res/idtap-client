name: Automated Release

on:
  push:
    branches: [ main ]
  # Manual recovery path: if a release run bumped/tagged but the PyPI upload
  # failed (e.g. transient OIDC outage), dispatching this workflow publishes
  # the version main is already at, without bumping again.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # FROZEN during the MIT-infra migration: this job bumps the version, publishes to the
    # real PyPI, and pushes a tag to main. It is gated OFF until cutover so merges to main
    # do NOT cut a new PyPI release. To re-enable at switchover, set the repository variable
    # ENABLE_PYPI_RELEASE = 'true' (Settings → Secrets and variables → Actions → Variables).
    # No logic was removed — only gated.
    if: ${{ vars.ENABLE_PYPI_RELEASE == 'true' }}
    concurrency: release
    permissions:
      id-token: write    # OIDC for PyPI trusted publishing
      contents: write    # Create releases and tags
      actions: write     # Update workflow permissions if needed
      pull-requests: write  # Version-bump commit lands via an auto-merged PR
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for semantic-release to work properly
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build twine toml
          
      - name: Validate version consistency
        run: |
          echo "Checking version consistency across files..."
          INIT_VERSION=$(python -c "import idtap; print(idtap.__version__)")
          TOML_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          
          echo "__init__.py version: $INIT_VERSION"
          echo "pyproject.toml version: $TOML_VERSION"
          
          if [ "$INIT_VERSION" != "$TOML_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            echo "__init__.py: $INIT_VERSION"
            echo "pyproject.toml: $TOML_VERSION"
            exit 1
          fi
          echo "✅ Versions are consistent"
          
      - name: Determine release mode
        id: release-check
        run: |
          # Modes: release (bump + publish), publish-only (manual dispatch:
          # publish the version main is already at), skip (bump commits).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=publish-only" >> $GITHUB_OUTPUT
            echo "🔁 Manual dispatch: publishing current version without bumping"
          else
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
            echo "Latest commit message: $COMMIT_MESSAGE"
            if echo "$COMMIT_MESSAGE" | grep -q "\[skip release\]\|\[skip ci\]"; then
              echo "mode=skip" >> $GITHUB_OUTPUT
              echo "🚫 Skipping release due to [skip release] or [skip ci] in commit message"
            else
              echo "mode=release" >> $GITHUB_OUTPUT
              echo "✅ Version will be bumped"
            fi
          fi
          CURRENT_VERSION=$(python -c "import idtap; print(idtap.__version__)")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
      - name: Run tests
        if: steps.release-check.outputs.mode != 'skip'
        run: |
          echo "Running tests before release..."
          pytest idtap/tests/ -m "not integration"
          
      - name: Configure git
        if: steps.release-check.outputs.mode == 'release'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Bump version
        if: steps.release-check.outputs.mode == 'release'
        id: bump-version
        run: |
          echo "Bumping patch version..."
          NEW_VERSION=$(python scripts/bump_version.py | grep "New version:" | cut -d' ' -f3)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version bumped to: $NEW_VERSION"
          
      - name: Build package
        if: steps.release-check.outputs.mode != 'skip'
        run: |
          echo "Building package..."
          python -m build
          
      - name: Commit version bump
        # Runs BEFORE publish so a failure here leaves a clean state (no
        # published version the repo doesn't know about). main is branch-
        # protected (require-PR), so a direct push is rejected — land the bump
        # through an auto-merged PR instead (0 approvals required; pushes made
        # with GITHUB_TOKEN don't re-trigger this workflow, so no loop).
        if: steps.release-check.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ steps.bump-version.outputs.new_version }}"
          git checkout -b "$BRANCH"
          git add idtap/__init__.py pyproject.toml docs/conf.py
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new_version }} [skip release]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${{ steps.bump-version.outputs.new_version }} [skip release]" \
            --body "Automated version bump from the release workflow."
          gh pr merge "$BRANCH" --squash --delete-branch
          git tag "v${{ steps.bump-version.outputs.new_version }}"
          git push origin "v${{ steps.bump-version.outputs.new_version }}"

      - name: Publish to PyPI
        if: steps.release-check.outputs.mode != 'skip'
        id: publish
        # Tolerate one transient failure (e.g. OIDC 503) — retried below.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Using trusted publishing - no username/password needed
          # PyPI trusted publisher must be configured for this repo
          print-hash: true
          # In publish-only recovery mode the version may already be up
          skip-existing: ${{ steps.release-check.outputs.mode == 'publish-only' }}

      - name: Wait before publish retry
        if: steps.release-check.outputs.mode != 'skip' && steps.publish.outcome == 'failure'
        run: |
          echo "⚠️ First publish attempt failed; retrying in 60s..."
          sleep 60

      - name: Publish to PyPI (retry)
        if: steps.release-check.outputs.mode != 'skip' && steps.publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: ${{ steps.release-check.outputs.mode == 'publish-only' }}

      - name: Output release info
        if: steps.release-check.outputs.mode != 'skip'
        run: |
          VERSION="${{ steps.bump-version.outputs.new_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ steps.release-check.outputs.current_version }}"
          fi
          echo "🚀 Released version: $VERSION"
          echo "📦 Package published to PyPI: https://pypi.org/project/idtap/$VERSION/"