name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on pull request comments that contain "@claude review"
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # @v1 (not @beta): the old beta action doesn't accept current OAuth
        # tokens (CLI reports apiKeySource "none") — mirrors the idtap repo.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # No `prompt:` on purpose — with a prompt the action runs in agent
          # mode, which posts no tracking comment (the review vanished, run
          # 30861734693). Tag mode reads the "@claude review" comment as the
          # instruction and posts the review in its own comment, matching the
          # working idtap setup.
